<!doctype html>
<html lang="pt-br" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="ORACULO.CSS" />
  </head>

  <body>
    <header>
      <h1>Oráculo</h1>
      <h5>- O que o destino reserva para você? -</h5>
      <p>
        Faça sua pergunta ao universo e descubra os mistérios do destino... 🎴
      </p>
    </header>
    <main>
      <div class="campo-pergunta">
        <label for="pergunta">🔮 Qual é a sua pergunta ao universo?</label>
        <br />
        <input
          type="text"
          id="pergunta"
          placeholder="O que o futuro me reserva?"
        />
        <button type="submit" class="btn-enviar" id="responder">
          Enviar ao universo
        </button>
        <p id="seila"></p>
      </div>
    </main>
    <footer>
      <p>✨ O universo sempre tem uma resposta para quem sabe perguntar. ✨</p>
      <p>© 2026 Oráculo - Todos os direitos reservados.</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="ORACULO.JS"></script>
  </body>
</html>
